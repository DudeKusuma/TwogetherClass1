<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" fill="none" role="img" aria-labelledby="title desc">
  <title id="title">Blueberry jam animated profile frame</title>
  <desc id="desc">A glossy purple jam ring with blueberries and little animated glints. The center is transparent for an avatar.</desc>
  <defs>
    <linearGradient id="jam" x1="54" y1="49" x2="205" y2="215" gradientUnits="userSpaceOnUse">
      <stop stop-color="#E8A2FF"/><stop offset=".34" stop-color="#A84CFA"/><stop offset=".68" stop-color="#7134D0"/><stop offset="1" stop-color="#401780"/>
    </linearGradient>
    <linearGradient id="shine" x1="70" y1="58" x2="194" y2="194" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFF4FF"/><stop offset="1" stop-color="#FFD3FF" stop-opacity=".15"/>
    </linearGradient>
    <radialGradient id="berry" cx="0" cy="0" r="1" gradientTransform="matrix(20 24 -23 19 91 72)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#A9C8FF"/><stop offset=".27" stop-color="#7654E8"/><stop offset="1" stop-color="#29246E"/>
    </radialGradient>
    <filter id="shadow" x="12" y="12" width="232" height="232" color-interpolation-filters="sRGB" filterUnits="userSpaceOnUse">
      <feGaussianBlur in="SourceAlpha" stdDeviation="4"/><feOffset dy="3"/><feComponentTransfer><feFuncA type="linear" slope=".35"/></feComponentTransfer><feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glow" x="0" y="0" width="256" height="256" color-interpolation-filters="sRGB" filterUnits="userSpaceOnUse">
      <feGaussianBlur stdDeviation="2.4" result="blur"/><feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <mask id="avatarOpening" maskUnits="userSpaceOnUse" x="0" y="0" width="256" height="256">
      <rect width="256" height="256" fill="white"/>
      <circle cx="128" cy="128" r="84" fill="black"/>
    </mask>
  </defs>
  <style>
    .jam-flow { stroke-dasharray: 34 22; animation: flow 8s linear infinite; }
    .twinkle { transform-box: fill-box; transform-origin: center; animation: twinkle 2.2s ease-in-out infinite; }
    .twinkle.t2 { animation-delay: .8s; }
    .berry-bob { transform-box: fill-box; transform-origin: center; animation: bob 3.5s ease-in-out infinite; }
    .berry-bob.b2 { animation-delay: -1.3s; }
    @keyframes flow { to { stroke-dashoffset: -224; } }
    @keyframes twinkle { 0%,100% { opacity:.45; transform:scale(.72) rotate(0deg); } 50% { opacity:1; transform:scale(1.12) rotate(45deg); } }
    @keyframes bob { 0%,100% { transform:translateY(0); } 50% { transform:translateY(-3px); } }
    @media (prefers-reduced-motion: reduce) { .jam-flow,.twinkle,.berry-bob { animation:none; } }
  </style>

  <g filter="url(#shadow)" mask="url(#avatarOpening)">
    <!-- A smooth band keeps the avatar opening clear all the way around. -->
    <circle cx="128" cy="128" r="91" fill="none" stroke="#3C176F" stroke-width="25"/>
    <circle cx="128" cy="128" r="91" fill="none" stroke="url(#jam)" stroke-width="20"/>
    <circle cx="128" cy="128" r="80.5" fill="none" stroke="url(#shine)" stroke-width="2.2" opacity=".78"/>
    <circle class="jam-flow" cx="128" cy="128" r="91" fill="none" stroke="#FFF0FF" stroke-width="2.6" opacity=".85" filter="url(#glow)"/>
  </g>

  <!-- Little glossy berries sit mostly outside the avatar opening. -->
  <g class="berry-bob">
    <circle cx="65" cy="77" r="18" fill="url(#berry)" stroke="#33206E" stroke-width="2"/>
    <path d="m65 59 3 5 6-2-3 6 4 4-7-1-3 6-2-6-7-1 6-3-1-7 4 5Z" fill="#87D889" stroke="#387447" stroke-width="1.4"/>
    <ellipse cx="59" cy="70" rx="4" ry="7" transform="rotate(30 59 70)" fill="#E8DEFF" opacity=".72"/>
  </g>
  <g class="berry-bob b2">
    <circle cx="194" cy="181" r="16" fill="url(#berry)" stroke="#33206E" stroke-width="2"/>
    <path d="m193 165 3 5 6-2-3 6 4 4-7-1-3 6-2-6-7-1 6-3-1-7 4 5Z" fill="#87D889" stroke="#387447" stroke-width="1.4"/>
    <ellipse cx="189" cy="175" rx="3.5" ry="6" transform="rotate(30 189 175)" fill="#E8DEFF" opacity=".72"/>
  </g>
  <circle cx="45" cy="146" r="5" fill="#B76DFF" stroke="#F5D8FF" stroke-width="1.5"/>
  <circle cx="218" cy="108" r="4" fill="#7041DB" stroke="#F5D8FF" stroke-width="1.5"/>
  <circle cx="89" cy="220" r="3.5" fill="#9F53F5" stroke="#F5D8FF" stroke-width="1.2"/>
  <path class="twinkle" d="m35 96 3 8 8 3-8 3-3 8-3-8-8-3 8-3 3-8Z" fill="#FFF3B0" stroke="#FFF9D8" stroke-width="1"/>
  <path class="twinkle t2" d="m218 147 2.5 6 6 2.5-6 2.5-2.5 6-2.5-6-6-2.5 6-2.5 2.5-6Z" fill="#FFF3B0" stroke="#FFF9D8" stroke-width=".8"/>
</svg>
